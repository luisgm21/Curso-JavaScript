<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

  <header class="titulo">
    Blackjack
  </header>

  <div class="row mt-2">
    <div class="col text-center">
      <button id="btnNuevo" class="btn btn-danger">Nuevo Juego</button>
      <button id="btnPedir" class="btn btn-primary" disabled>Pedir Carta</button>
      <button id="btnDetener" class="btn btn-primary" disabled>Detener</button>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <h1>Jugador 1 - <small>0</small></h1>
      <div class="divCartas">
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <h1>Computadora - <small>0</small></h1>
      <div class="divCartas">
      </div>
    </div>
  </div>

  <dialog id="modal-victoria" closedby="any">
    <h1>¡Felicidades!</h1>
    <p>Ganaste la partida</p>
    <form>
      <button formmethod="dialog" id="btnCerrar-victoria">Cerrar</button>
    </form>
  </dialog>

  <dialog id="modal-derrota" closedby="any">
    <h1>¡Lo siento!</h1>
    <p>Perdiste la partida</p>
    <form>
      <button formmethod="dialog" id="btnCerrar-derrota">Cerrar</button>
    </form>
  </dialog>

  <script src="assets/js/underscore-min.js"></script>
  <script src="assets/js/juego.js"></script>
  <script>
    miModulo.nuevoJuego();
  </script>
</body>

</html>
